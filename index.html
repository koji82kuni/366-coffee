<style>
  :root{

    --wash:#F3E8D6;
    --serif:Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box}
  .wrap{
    font-family:var(--sans); background:var(--paper); color:var(--ink);
    min-height:100vh; margin:0 auto; max-width:520px; padding:0 18px 56px;
    line-height:1.7; -webkit-text-size-adjust:100%;
  }
  header{text-align:center; padding:34px 0 26px}
  .bean{display:block; margin:0 auto 12px}
  .brand{font-family:var(--serif); font-weight:700; font-size:.86rem; letter-spacing:.16em; color:var(--amber); margin:0}
  .brand-rule{width:56px; height:2px; background:var(--amber); margin:8px auto 0; border-radius:2px}
  h1{font-size:1.6rem; line-height:1.45; margin:22px 0 8px; text-wrap:balance}
  .lead{margin:0; color:var(--soft); font-size:.95rem}

  .prog{display:flex; gap:6px; justify-content:center; margin:0 0 26px}
  .prog i{width:34px; height:4px; border-radius:99px; background:var(--line); transition:background .3s}
  .prog i.on{background:var(--amber)}

  .q{font-size:1.18rem; font-weight:700; margin:0 0 18px; text-wrap:balance}
  .qnum{font-family:var(--serif); font-style:italic; color:var(--amber-lt); font-size:.86rem; letter-spacing:.1em; display:block; margin-bottom:6px}
  .opts{display:grid; gap:11px}
  .opt{
    width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px 17px; transition:border-color .18s, transform .1s, box-shadow .18s;
    box-shadow:0 1px 2px rgba(38,27,17,.04);
  }
  .opt:hover{border-color:var(--amber); box-shadow:0 4px 14px rgba(38,27,17,.08)}
  .opt:active{transform:scale(.99)}
  .opt b{display:block; font-size:1.02rem}
  .opt span{display:block; color:var(--soft); font-size:.86rem; margin-top:3px}

  .btn{
    display:inline-block; width:100%; text-align:center; cursor:pointer;
    font:inherit; font-weight:700; border:0; border-radius:99px;
    background:var(--espresso); color:var(--cream); padding:15px 20px;
    text-decoration:none; transition:opacity .18s;
  }
  .btn:hover{opacity:.88}
  .btn.amber{background:var(--amber)}
  .btn.ghost{background:transparent; color:var(--soft); border:1px solid var(--line); font-weight:400}
  .btn.sm{padding:11px 18px; font-size:.92rem}

  .back{background:none; border:0; color:var(--soft); font:inherit; font-size:.86rem; cursor:pointer; padding:10px 2px; margin-top:14px}
  .back:hover{color:var(--amber)}

  .sec-label{font-family:var(--serif); font-style:italic; letter-spacing:.12em; font-size:.78rem; color:var(--amber); margin:30px 0 10px; text-align:center}
  .res-head{background:var(--espresso); color:var(--cream); border-radius:18px 18px 0 0; padding:26px 22px 22px; text-align:center}
  .res-eyebrow{font-family:var(--serif); font-style:italic; letter-spacing:.14em; font-size:.78rem; color:var(--amber-lt); margin:0 0 10px}
  .res-en{font-family:var(--serif); font-weight:700; font-size:1.85rem; margin:0; line-height:1.15}
  .res-jp{margin:8px 0 0; color:var(--amber-lt); font-size:.92rem}
  .res-badge{display:inline-block; margin-top:14px; border:2px solid var(--cream); border-radius:99px; padding:5px 18px; font-weight:700; font-size:.95rem}
  .res-body{background:#fff; border:1px solid var(--line); border-top:0; border-radius:0 0 18px 18px; padding:24px 22px 26px}
  .flavor{font-size:1.06rem; font-weight:700; margin:0 0 4px; text-wrap:balance}
  .why{color:var(--soft); font-size:.9rem; margin:10px 0 0}
  .radar{display:block; margin:6px auto 2px}
  .spec{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 0; border-top:1px dashed var(--line); padding-top:16px}
  .chip{background:var(--wash); border-radius:99px; padding:6px 13px; font-size:.84rem}
  .chip b{color:var(--amber); font-weight:700}
  .grind{margin:16px 0 0; background:var(--wash); border-radius:12px; padding:13px 15px; font-size:.9rem}
  .grind b{color:var(--amber)}
  .cta{margin-top:20px; display:grid; gap:10px}

  .alt{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px 20px; box-shadow:0 1px 2px rgba(38,27,17,.04)}
  .alt-top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .alt-en{font-family:var(--serif); font-weight:700; font-size:1.12rem; margin:0}
  .alt-badge{background:var(--wash); color:var(--amber); border-radius:99px; padding:3px 11px; font-size:.8rem; font-weight:700}
  .alt-jp{color:var(--soft); font-size:.84rem; margin:3px 0 0}
  .alt-flavor{font-weight:700; margin:12px 0 0}
  .alt-why{color:var(--soft); font-size:.88rem; margin:6px 0 16px}

  .setbox{margin-top:22px; background:var(--wash); border-radius:16px; padding:20px; text-align:center}
  .setbox p{margin:0 0 14px; font-size:.94rem}
  .setbox b{color:var(--amber)}
  .setbox .btn+.btn{margin-top:10px}

  .note{font-size:.82rem; color:var(--soft); text-align:center; margin:18px 0 0}
  footer{margin-top:34px; border-top:1px solid var(--line); padding-top:18px; text-align:center; color:var(--soft); font-size:.8rem}
  footer .f-brand{font-family:var(--serif); font-weight:700; color:var(--ink); font-size:.9rem; letter-spacing:.06em}

  /* ── 日本語の改行制御 ──────────────────────────
     本文には文節の切れ目に <wbr> を仕込んである（BudouXでビルド時に解析）。
     keep-all で「文節の途中では折り返さない」を宣言し、<wbr> の位置だけで
     改行させる。これで「カカ／オ」のような単語の分断が起きなくなる。
     break-word は、1文節が行幅に収まらない極端な場合だけの保険。 */
  .wrap{ word-break:keep-all; overflow-wrap:break-word; line-break:strict; }
  /* 行末に1〜2文字だけ残るのを防ぐ */
  .wrap p, .wrap .flavor, .wrap .why, .wrap .alt-why, .wrap .grind,
  .wrap .note, .wrap footer, .wrap .setbox p, .wrap .lead{ text-wrap:pretty; }
  /* 短文は行数を均等に割る */
  .wrap h1, .wrap .q, .wrap .flavor, .wrap .alt-flavor,
  .wrap .why, .wrap .alt-why{ text-wrap:balance; }
  .nb{ white-space:nowrap; }

  .hide{display:none}
  :focus-visible{outline:2.5px solid var(--amber); outline-offset:3px; border-radius:10px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      {t:"特に<wbr>ありません", s:"いろいろ試してみたい", v:"any"}
    ]},
    {q:"ご自宅に<wbr>コーヒーミルは<wbr>ありますか？", opts:[
      {t:"ある", s:"挽きたての<wbr>香りを<wbr>楽しめます", v:"mill"},
      {t:"ない<wbr>・わからない", s:"こちらで<wbr>挽いてお届けします", v:"nomill"}
    ]}
  ];

  var ans = [], step = 0;
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var itemUrl = function(b){ return SHOP + (MODE==="mall" ? "/products/" : "/items/") + b.id; };

  function renderQ(){
    var d = QS[step];
    $("qnum").textContent = "QUESTION " + (step+1);
    $("qtext").innerHTML = d.q;   // 文節の <wbr> を活かすため innerHTML
    [].forEach.call($("prog").children, function(el,i){ el.classList.toggle("on", i<=step); });
    var box = $("opts"); box.innerHTML = "";
    d.opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = "<b></b><span></span>";
      b.querySelector("b").innerHTML = o.t;
      b.querySelector("span").innerHTML = o.s;
      b.addEventListener("click", function(){
        ans[step] = o.v; step++;
        if(step < QS.length){ renderQ(); } else { showResult(); }
        window.scrollTo({top:0, behavior:"smooth"});
      });
      box.appendChild(b);
    });
    $("back").classList.toggle("hide", step===0);
  }

  function adjTaste(bean, roast){
    var t = {}, adj = ADJ[roast];
    Object.keys(bean.taste).forEach(function(k){
      t[k] = Math.max(1, Math.min(5, bean.taste[k] + (adj[k]||0)));
    });
    return t;
  }

  function radarSVG(taste, color){
    var keys = Object.keys(taste), n = keys.length, S = 230, C = S/2, R = 74;
    var pt = function(i, r){
      var a = (-90 + 360/n*i) * Math.PI/180;
      return [C + r*Math.cos(a), C + r*Math.sin(a)];
    };
    var s = '<svg class="radar" width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'" role="img" aria-label="味わいのバランス">';
    for(var L=1; L<=5; L++){
      var ring = [];
      for(var i=0;i<n;i++){ ring.push(pt(i, R*L/5).join(",")); }
      s += '<polygon points="'+ring.join(" ")+'" fill="none" stroke="#DFD5C4" stroke-width="1"/>';
    }
    for(var j=0;j<n;j++){ var p=pt(j,R); s += '<line x1="'+C+'" y1="'+C+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#DFD5C4" stroke-width="1"/>'; }
    var data = [];
    keys.forEach(function(k,i){ data.push(pt(i, R*taste[k]/5).join(",")); });
    s += '<polygon points="'+data.join(" ")+'" fill="'+color+'" fill-opacity=".26" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round"/>';
    keys.forEach(function(k,i){
      var p = pt(i, R*taste[k]/5);
      s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="'+color+'"/>';
    });
    keys.forEach(function(k,i){
      var p = pt(i, R+22);
      s += '<text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="12" fill="#78685A" font-family="system-ui,sans-serif">'+k+'</text>';
    });
    return s + "</svg>";
  }

  function showResult(){
    var m = MAP[ans[0] + "|" + ans[1]] || ["ブラジル","中煎り","甘みが<wbr>あって<wbr>飲みやすい、<wbr>当店の<wbr>定番です。","グアテマラ","中煎り","バランス型で<wbr>飲み疲れしに<wbr>くい一杯です。"];
    var n1=m[0], r1=m[1], why1=m[2], n2=m[3], r2=m[4], why2=m[5];
    var b1 = BEANS[n1], b2 = BEANS[n2];

    var grind = ans[2] === "mill"
      ? ['豆のまま', 'ミルが<wbr>あるとの<wbr>ことなので<b class="nb">「豆の<wbr>まま」</b>が<wbr>おすすめです。<wbr>淹れる<wbr>直前に<wbr>挽くと<wbr>香りが<wbr>際立ちます。']
      : ['ペーパーフィルター用', 'ミルが<wbr>なくても<wbr>大丈夫です。<wbr>ご注文時に<b class="nb">「ペーパーフィルター用」</b>を<wbr>お選びいただければ、<wbr>こちらで<wbr>挽いてお届けします。'];

    // 本文は <wbr> 入りのHTMLなので esc は通さない（データはビルド時に生成した固定値）
    $("result").innerHTML =
      '<p class="sec-label">RECOMMENDED FOR YOU</p>'+
      '<div class="res-head">'+
        '<p class="res-eyebrow">1st CUP</p>'+
        '<p class="res-en">'+esc(b1.en)+'</p>'+
        '<p class="res-jp">'+b1.jp+'</p>'+
        '<div class="res-badge">'+esc(r1)+'</div>'+
      '</div>'+
      '<div class="res-body">'+
        radarSVG(adjTaste(b1,r1), "#B0641F")+
        '<p class="flavor">'+b1.flavor[r1]+'</p>'+
        '<p class="why">'+why1+'</p>'+
        '<div class="spec">'+
          '<span class="chip"><b>内容量</b> 100g</span>'+
          '<span class="chip"><b>おすすめ湯温</b> '+TEMP[r1]+'℃</span>'+
          '<span class="chip"><b>豆の状態</b> '+grind[0]+'</span>'+
        '</div>'+
        '<p class="grind">'+grind[1]+'</p>'+
        '<p class="grind">商品ページで<b class="nb">「'+esc(r1)+'」</b>と<b class="nb">「'+grind[0]+'」</b>を<wbr>お選びください。</p>'+
        '<div class="cta"><a class="btn amber" href="'+itemUrl(b1)+'">この<wbr>豆を<wbr>見る<wbr>（ショップへ）</a></div>'+
      '</div>'+

      '<p class="sec-label">もう一杯えらぶなら</p>'+
      '<div class="alt">'+
        '<div class="alt-top">'+
          '<p class="alt-en">'+esc(b2.en)+'</p>'+
          '<span class="alt-badge">'+esc(r2)+'</span>'+
        '</div>'+
        '<p class="alt-jp">'+b2.jp+'</p>'+
        '<p class="alt-flavor">'+b2.flavor[r2]+'</p>'+
        '<p class="alt-why">'+why2+'</p>'+
        '<a class="btn ghost sm" href="'+itemUrl(b2)+'">この<wbr>豆を<wbr>見る</a>'+
      '</div>'+

      setBox(n1, n2)+

      '<div class="cta" style="margin-top:16px">'+
        '<button class="btn ghost" type="button" id="again">もう<wbr>一度<wbr>診断する</button>'+
      '</div>'+
      '<p class="note">お届けまで、<wbr>最長2週間ほど<wbr>お時間を<wbr>いただく<wbr>場合が<wbr>ございます。</p>';

    $("quiz").classList.add("hide");
    $("result").classList.remove("hide");
    $("again").addEventListener("click", function(){
      ans = []; step = 0;
      $("result").classList.add("hide");
      $("quiz").classList.remove("hide");
      renderQ(); window.scrollTo({top:0,behavior:"smooth"});
    });
  }

  $("start").addEventListener("click", function(){
    $("intro").classList.add("hide");
    $("quiz").classList.remove("hide");
    renderQ();
  });
  $("back").addEventListener("click", function(){ if(step>0){ step--; renderQ(); } });
})();
</script>
</body>
</html>
