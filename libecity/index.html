  .prog i.on{background:var(--amber)}

  .q{font-size:1.18rem; font-weight:700; margin:0 0 18px; text-wrap:balance}
  .qnum{font-family:var(--serif); font-style:italic; color:var(--amber-lt); font-size:.86rem; letter-spacing:.1em; display:block; margin-bottom:6px}
  .opts{display:grid; gap:11px}

    background:#fff; border:1px solid var(--line); border-radius:14px;

  .opt:hover{border-color:var(--amber); box-shadow:0 4px 14px rgba(38,27,17,.08)}

  .opt b{display:block; font-size:1.02rem}
  .opt span{display:block; color:var(--soft); font-size:.86rem; margin-top:3px}

  .btn{

  .btn.ghost{background:transparent; color:var(--soft); border:1px solid var(--line); font-weight:400}
  .btn.sm{padding:11px 18px; font-size:.92rem}

  .back{background:none; border:0; color:var(--soft); font:inherit; font-size:.86rem; cursor:pointer; padding:10px 2px; margin-top:14px}
  .back:hover{color:var(--amber)}

  .res-head{background:var(--espresso); color:var(--cream); border-radius:18px 18px 0 0; padding:26px 22px 22px; text-align:center}
  .res-eyebrow{font-family:var(--serif); font-style:italic; letter-spacing:.14em; font-size:.78rem; color:var(--amber-lt); margin:0 0 10px}
  .res-en{font-family:var(--serif); font-weight:700; font-size:1.85rem; margin:0; line-height:1.15}
  .res-jp{margin:8px 0 0; color:var(--amber-lt); font-size:.92rem}

  .why{color:var(--soft); font-size:.9rem; margin:10px 0 0}
  .radar{display:block; margin:6px auto 2px}
  .spec{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 0; border-top:1px dashed var(--line); padding-top:16px}
  .chip{background:var(--wash); border-radius:99px; padding:6px 13px; font-size:.84rem}

  .grind{margin:16px 0 0; background:var(--wash); border-radius:12px; padding:13px 15px; font-size:.9rem}

  .cta{margin-top:20px; display:grid; gap:10px}

  .alt-jp{color:var(--soft); font-size:.84rem; margin:3px 0 0}
  .alt-flavor{font-weight:700; margin:12px 0 0}
  .alt-why{color:var(--soft); font-size:.88rem; margin:6px 0 16px}

  .setbox{margin-top:22px; background:var(--wash); border-radius:16px; padding:20px; text-align:center}
  .setbox p{margin:0 0 14px; font-size:.94rem}
  .setbox b{color:var(--amber)}
  .setbox .btn+.btn{margin-top:10px}

  .note{font-size:.82rem; color:var(--soft); text-align:center; margin:18px 0 0}
  footer{margin-top:34px; border-top:1px solid var(--line); padding-top:18px; text-align:center; color:var(--soft); font-size:.8rem}
  footer .f-brand{font-family:var(--serif); font-weight:700; color:var(--ink); font-size:.9rem; letter-spacing:.06em}

  .wrap p, .wrap .flavor, .wrap .why, .wrap .alt-why, .wrap .grind,
  .wrap .note, .wrap footer, .wrap .setbox p, .wrap .lead{ text-wrap:pretty; }

  .wrap .flavor, .wrap .alt-flavor,

  .nb{ white-space:nowrap; }

  .hide{display:none}
  :focus-visible{outline:2.5px solid var(--amber); outline-offset:3px; border-radius:10px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  }

  function radarSVG(taste, color){
    var keys = Object.keys(taste), n = keys.length, S = 230, C = S/2, R = 74;
    var pt = function(i, r){
      var a = (-90 + 360/n*i) * Math.PI/180;
      return [C + r*Math.cos(a), C + r*Math.sin(a)];
    };
    var s = '<svg class="radar" width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'" role="img" aria-label="味わいのバランス">';
    for(var L=1; L<=5; L++){
      var ring = [];
      for(var i=0;i<n;i++){ ring.push(pt(i, R*L/5).join(",")); }
      s += '<polygon points="'+ring.join(" ")+'" fill="none" stroke="#DFD5C4" stroke-width="1"/>';
    }
    for(var j=0;j<n;j++){ var p=pt(j,R); s += '<line x1="'+C+'" y1="'+C+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#DFD5C4" stroke-width="1"/>'; }
    var data = [];
    keys.forEach(function(k,i){ data.push(pt(i, R*taste[k]/5).join(",")); });
    s += '<polygon points="'+data.join(" ")+'" fill="'+color+'" fill-opacity=".26" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round"/>';
    keys.forEach(function(k,i){
      var p = pt(i, R*taste[k]/5);
      s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="'+color+'"/>';
    });
    keys.forEach(function(k,i){
      var p = pt(i, R+22);
      s += '<text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="12" fill="#78685A" font-family="system-ui,sans-serif">'+k+'</text>';
    });
    return s + "</svg>";
  }

  function showResult(){
    var m = MAP[ans[0] + "|" + ans[1]] || ["ブラジル","中煎り","甘みがあって飲みやすい、当店の定番です。","グアテマラ","中煎り","バランス型で飲み疲れしにくい一杯です。"];
    var n1=m[0], r1=m[1], why1=m[2], n2=m[3], r2=m[4], why2=m[5];
    var b1 = BEANS[n1], b2 = BEANS[n2];

    var grind = ans[2] === "mill"
      ? ['豆のまま', 'ミルがあるとのことなので<br><b class="nb">「豆のまま」</b>がおすすめです。<br>淹れる直前に挽くと香りが際立ちます。']
      : ['ペーパーフィルター用', 'ミルがなくても大丈夫です。<br>ご注文時に<b class="nb">「ペーパーフィルター用」</b>を<br>お選びいただければ、こちらで挽きます。'];

    $("result").innerHTML =
      '<p class="sec-label">RECOMMENDED FOR YOU</p>'+
      '<div class="res-head">'+
        '<p class="res-eyebrow">1st CUP</p>'+
        '<p class="res-en">'+esc(b1.en)+'</p>'+
        '<p class="res-jp">'+esc(b1.jp)+'</p>'+
        '<div class="res-badge">'+esc(r1)+'</div>'+
      '</div>'+
      '<div class="res-body">'+
        radarSVG(adjTaste(b1,r1), "#B0641F")+
        '<p class="flavor">'+esc(b1.flavor[r1])+'</p>'+
        '<p class="why">'+esc(why1)+'</p>'+
        '<div class="spec">'+
          '<span class="chip"><b>内容量</b> 100g</span>'+
          '<span class="chip"><b>おすすめ湯温</b> '+TEMP[r1]+'℃</span>'+
          '<span class="chip"><b>豆の状態</b> '+grind[0]+'</span>'+
        '</div>'+
        '<p class="grind">'+grind[1]+'</p>'+
        '<p class="grind">商品ページで<b class="nb">「'+esc(r1)+'」</b>と<b class="nb">「'+grind[0]+'」</b>を<br>お選びください。</p>'+
        '<div class="cta"><a class="btn amber" href="'+itemUrl(b1)+'">この豆を見る（ショップへ）</a></div>'+
      '</div>'+

      '<p class="sec-label">もう一杯えらぶなら</p>'+
      '<div class="alt">'+
        '<div class="alt-top">'+
          '<p class="alt-en">'+esc(b2.en)+'</p>'+
          '<span class="alt-badge">'+esc(r2)+'</span>'+
        '</div>'+
        '<p class="alt-jp">'+esc(b2.jp)+'</p>'+
        '<p class="alt-flavor">'+esc(b2.flavor[r2])+'</p>'+
        '<p class="alt-why">'+esc(why2)+'</p>'+
        '<a class="btn ghost sm" href="'+itemUrl(b2)+'">この豆を見る</a>'+
      '</div>'+

      setBox(n1, n2)+

      '<div class="cta" style="margin-top:16px">'+
        '<button class="btn ghost" type="button" id="again">もう一度診断する</button>'+
      '</div>'+
      '<p class="note">お届けまで、最長2週間ほど<br>お時間をいただく場合がございます。</p>';

    $("quiz").classList.add("hide");
    $("result").classList.remove("hide");
    $("again").addEventListener("click", function(){
      ans = []; step = 0;
      $("result").classList.add("hide");
      $("quiz").classList.remove("hide");
      renderQ(); window.scrollTo({top:0,behavior:"smooth"});
    });
  }

  $("start").addEventListener("click", function(){
    $("intro").classList.add("hide");
    $("quiz").classList.remove("hide");
    renderQ();
  });
  $("back").addEventListener("click", function(){ if(step>0){ step--; renderQ(); } });
})();
</script>
